name: gen-keystore
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate fixed debug keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
      - name: Commit keystore back to repo
        run: |
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-bot"
          git add android/app/debug.keystore
          git commit -m "chore: add fixed debug keystore [skip ci]" || echo "nothing to commit"
          git push
