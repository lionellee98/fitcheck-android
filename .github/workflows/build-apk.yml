name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install deps & sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-checkin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to fixed "latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: latest
        run: |
          API="https://api.github.com/repos/$REPO"
          # 删除已存在的 latest release 与 tag（保证永远指向最新构建）
          REL_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API/releases/tags/$TAG" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -n "$REL_ID" ]; then
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$API/releases/$REL_ID" > /dev/null
          fi
          curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "$API/git/refs/tags/$TAG" > /dev/null || true
          # 创建新的 latest release
          BODY="自动构建的最新版 APK (commit ${GITHUB_SHA:0:7})"
          REL=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag\":\"$TAG\",\"name\":\"latest\",\"body\":\"$BODY\",\"prerelease\":false}" "$API/releases")
          UPLOAD=$(echo "$REL" | grep -o '"upload_url":"[^"]*' | head -1 | sed 's/"upload_url":"//' | sed 's/{?name,label}//')
          # 上传 APK 作为资产
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk \
            "$UPLOAD?name=app-debug.apk"
          echo "Published latest release: https://github.com/$REPO/releases/latest"

