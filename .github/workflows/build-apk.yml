name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set app version in source (before sync)
        run: python3 .github/scripts/patch_index_version.py
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Vendor TF.js + MoveNet locally (offline-capable, no CDN)
        run: |
          mkdir -p /tmp/tfinstall
          cd /tmp/tfinstall
          npm init -y > /dev/null 2>&1
          npm install @tensorflow/tfjs@4.22.0 @tensorflow-models/pose-detection@2.1.3 > /dev/null 2>&1
          mkdir -p "$GITHUB_WORKSPACE/fitness-app/vendor/movenet"
          cp /tmp/tfinstall/node_modules/@tensorflow/tfjs/dist/tf.min.js "$GITHUB_WORKSPACE/fitness-app/vendor/tf.min.js"
          cp /tmp/tfinstall/node_modules/@tensorflow-models/pose-detection/dist/pose-detection.min.js "$GITHUB_WORKSPACE/fitness-app/vendor/pose-detection.min.js"
          node "$GITHUB_WORKSPACE/.github/scripts/fetch_movenet.js"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Generate offline Chinese TTS voice pack (no system TTS)
        run: |
          python3 -m pip install --quiet edge-tts
          python3 .github/scripts/gen_tts.py
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install deps & sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Inject signing config & bump version in build.gradle
        run: python3 .github/scripts/patch_gradle.py
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-checkin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to fixed "latest" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          # 删除已存在的 latest release 与 tag（保证永远指向最新构建）
          gh release delete latest -y > /dev/null 2>&1 || true
          git push --delete origin latest > /dev/null 2>&1 || true
          # 重新发布，固定 tag=latest，永远指向最新构建
          gh release create latest "$APK" \
            --title "latest" \
            --notes "自动构建的最新版 APK (commit ${GITHUB_SHA:0:7})"
          echo "Published: https://github.com/${{ github.repository }}/releases/latest"

