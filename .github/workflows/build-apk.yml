name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install deps & sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-checkin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
