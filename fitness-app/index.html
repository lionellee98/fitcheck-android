<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>健身打卡</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">健身打卡</span>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="切换主题">🌙</button>
    </header>

    <main class="pages">
      <!-- 1. 每日计划 -->
      <section id="page-plan" class="page active">
        <div id="planHero" class="hero-card"></div>
        <div id="planConfig" class="card">
          <div class="field">
            <label>今日锻炼时长</label>
            <div class="seg" id="durationSeg">
              <button data-v="ai" class="active">AI 建议</button>
              <button data-v="20">20 分</button>
              <button data-v="30">30 分</button>
              <button data-v="45">45 分</button>
              <button data-v="60">60 分</button>
            </div>
            <input id="durationCustom" class="text-input" type="number" inputmode="numeric" placeholder="或自定义分钟数" />
          </div>
          <div class="field">
            <label>锻炼环境</label>
            <div class="seg" id="envSeg">
              <button data-v="gym" class="active">🏋️ 健身房</button>
              <button data-v="home">🏠 居家</button>
              <button data-v="outdoor">🌳 室外体育场</button>
            </div>
          </div>
          <div class="field">
            <label>训练部位</label>
            <div class="seg" id="partsModeSeg">
              <button data-v="ai" class="active">✨ AI 智能推荐</button>
              <button data-v="manual">✋ 自选部位</button>
            </div>
            <div id="partsChips" class="chips parts-chips"></div>
            <div id="partsHint" class="parts-hint"></div>
          </div>
          <button id="genPlanBtn" class="primary-btn">生成今日计划</button>
        </div>
        <div id="planPreview"></div>
        </div>
        <div id="planResult"></div>
      </section>

      <!-- 2. 本月进度 -->
      <section id="page-progress" class="page">
        <div id="progressSummary" class="card"></div>
        <div class="card">
          <div class="card-title">本月日历</div>
          <div id="calendar" class="calendar"></div>
          <div id="dayDetail" class="day-detail"></div>
        </div>
        <div class="card">
          <div class="card-title">部位打卡统计</div>
          <div id="partStats"></div>
        </div>
        <div class="card">
          <div class="card-title">月度总结</div>
          <div id="monthSummary" class="summary-text"></div>
        </div>
      </section>

      <!-- 3. 动作指导 -->
      <section id="page-guide" class="page">
        <div class="search-wrap">
          <input id="guideSearch" class="text-input search-input" type="search" placeholder="搜索肌肉 / 动作，如「肩中束」「卧推」" />
          <div id="suggestBox" class="suggest-box"></div>
        </div>
        <div id="regionChips" class="chips"></div>
        <div id="guideGrid" class="guide-grid"></div>
        <button id="loadMoreGuide" class="ghost-btn" hidden>加载更多</button>
      </section>

      <!-- 4. 身体情况 -->
      <section id="page-body" class="page">
        <div class="card">
          <div class="card-title">身体数据</div>
          <div class="field row">
            <div><label>体重 (kg)</label><input id="inpWeight" class="text-input" type="number" inputmode="decimal" /></div>
            <div><label>身高 (cm)</label><input id="inpHeight" class="text-input" type="number" inputmode="numeric" /></div>
          </div>
          <button id="saveBodyBtn" class="primary-btn">保存并分析</button>
          <div id="bodyAnalysis" class="analysis"></div>
        </div>
        <div class="card">
          <div class="card-title">参考照片（仅本地留存）</div>
          <input id="photoInput" type="file" accept="image/*" hidden />
          <button id="addPhotoBtn" class="ghost-btn">＋ 上传照片</button>
          <div id="photoList" class="photo-list"></div>
          <div class="field" style="margin-top:14px">
            <label>标记想加强的部位（反馈到每日计划）</label>
            <div id="concernChips" class="chips"></div>
          </div>
          <div id="concernAdvice" class="analysis"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="plan"><span class="nav-ic">📅</span><span>每日计划</span></button>
      <button class="nav-btn" data-page="progress"><span class="nav-ic">📊</span><span>本月进度</span></button>
      <button class="nav-btn" data-page="guide"><span class="nav-ic">📚</span><span>动作指导</span></button>
      <button class="nav-btn" data-page="body"><span class="nav-ic">🧍</span><span>身体情况</span></button>
    </nav>
  </div>

  <!-- 每日鼓励弹窗 -->
  <div id="quoteModal" class="modal-mask">
    <div class="modal quote-modal">
      <div class="quote-badge">今日打气</div>
      <p id="quoteText" class="quote-text"></p>
      <button id="quoteClose" class="primary-btn">开始今日打卡 💪</button>
    </div>
  </div>

  <!-- 动作详情弹窗 -->
  <div id="exerciseModal" class="modal-mask">
    <div class="modal ex-modal">
      <button class="modal-close" data-close="exerciseModal">✕</button>
      <div id="exMedia" class="ex-media"></div>
      <h3 id="exName" class="ex-name"></h3>
      <div id="exMeta" class="ex-meta"></div>
      <div class="ex-section-title">动作要领</div>
      <p id="exDesc" class="ex-desc"></p>
      <ol id="exSteps" class="ex-steps"></ol>
    </div>
  </div>

  <!-- 跟练弹窗 -->
  <div id="workoutModal" class="modal-mask">
    <div class="modal wo-modal">
      <button class="modal-close" data-close="workoutModal">✕</button>
      <div id="woPhase" class="wo-phase"></div>
      <div id="woTimerWrap" class="wo-timer-wrap">
        <svg class="wo-ring" viewBox="0 0 120 120">
          <circle class="wo-ring-bg" cx="60" cy="60" r="54"></circle>
          <circle id="woRing" class="wo-ring-fg" cx="60" cy="60" r="54"></circle>
        </svg>
        <div id="woTime" class="wo-time">00:00</div>
      </div>
      <div id="woExercise" class="wo-exercise"></div>
      <div id="woCoach" class="wo-coach"></div>
      <div class="wo-controls">
        <button id="woToggle" class="primary-btn">开始</button>
        <button id="woSkip" class="ghost-btn">跳过这组</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
